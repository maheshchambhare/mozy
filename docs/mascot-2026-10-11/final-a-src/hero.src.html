<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moz hero · final-a</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 700px; background: #f4f1ea; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .card { position: absolute; inset: 24px; border-radius: 34px; overflow: hidden;
    background: radial-gradient(70% 90% at 70% 10%, #1b2448 0%, #0b0e1a 62%), #0b0e1a; }
  .stars { position: absolute; inset: 0; background:
    radial-gradient(1.6px 1.6px at 12% 18%, #fff8 50%, transparent 51%), radial-gradient(1.2px 1.2px at 26% 9%, #fff6 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 44% 22%, #fff7 50%, transparent 51%), radial-gradient(1.2px 1.2px at 58% 12%, #fff5 50%, transparent 51%),
    radial-gradient(1.8px 1.8px at 83% 16%, #fff8 50%, transparent 51%), radial-gradient(1.2px 1.2px at 92% 34%, #fff5 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 36% 38%, #fff4 50%, transparent 51%), radial-gradient(1.5px 1.5px at 8% 44%, #fff5 50%, transparent 51%); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(#0f1428, #131a33); }
  .phone { position: absolute; left: 480px; top: 118px; width: 220px; height: 440px; border-radius: 38px; background: #1c2133;
    box-shadow: 0 0 0 2px #2c3350 inset, 0 30px 60px rgba(0,0,0,.45); padding: 10px; }
  .screen { width: 100%; height: 100%; border-radius: 30px; background: linear-gradient(#20294a, #141a30); position: relative; overflow: hidden; }
  .notch { position: absolute; left: 50%; top: 10px; width: 64px; height: 18px; margin-left: -32px; border-radius: 10px; background: #0b0e1a; }
  .ring { position: absolute; left: 50%; top: 92px; width: 120px; height: 120px; margin-left: -60px; border-radius: 50%;
    background: conic-gradient(#22C55E 0 28%, #2a3354 28% 100%); }
  .ring::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #18203b; }
  .tiles { position: absolute; left: 22px; right: 22px; top: 250px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .tiles i { aspect-ratio: 1; border-radius: 14px; background: #2a3354; opacity: .8; position: relative; }
  .tiles i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 11px; margin: -2px 0 0 -7px; border-radius: 3px; background: #6b7499; }
  .tiles i::before { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -10px 0 0 -7px; border-radius: 6px 6px 0 0; border: 2.5px solid #6b7499; border-bottom: 0; }
  .moz-wrap { position: absolute; left: 70px; bottom: 34px; width: 340px; }
  .moz-wrap .moz * { animation: none !important; }
</style>
</head>
<body>
<div class="card"><div class="stars"></div><div class="floor"></div>
  <div class="phone"><div class="screen"><div class="notch"></div><div class="ring"></div><div class="tiles"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
  <div class="moz-wrap" id="m"></div>
</div>
<style>/*KIT_CSS*/</style>
<script>
/*KIT_JS*/
document.getElementById('m').innerHTML = moz('stern', { prefix: 'hero', title: 'Moz, stern' });
</script>
</body>
</html>
