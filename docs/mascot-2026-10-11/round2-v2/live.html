<!doctype html><html><head><meta charset="utf-8"><title>Moz · variation 2</title><link rel="stylesheet" href="moz.css"><script src="moz.js"></script>
<style>body{margin:0;background:#f6f3ee;font:600 15px -apple-system,sans-serif;color:#555;padding:24px}h1{margin:0 0 4px;color:#222}p{margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}.c{text-align:center}.night{background:#0b0e1a;border-radius:18px;padding:10px;color:#aab}
.meadow{position:relative;height:330px;border-radius:18px;overflow:hidden;background:linear-gradient(#bfe4f8 0 62%,#86c95f 62%);margin-bottom:18px}
.path{position:absolute;left:0;right:0;top:72%;height:44px;background:repeating-linear-gradient(90deg,#e8d3a6 0 46px,#dcc391 46px 52px);animation:ground 1.1s linear infinite}
.hills{position:absolute;left:0;right:0;top:44%;height:70px;background:radial-gradient(ellipse 160px 60px at 120px 70px,#a8d888 98%,transparent) repeat-x;background-size:320px 70px;animation:ground 6s linear infinite}
.walker{position:absolute;left:50%;top:6%;width:250px;transform:translateX(-50%)}
@keyframes ground{from{background-position-x:0}to{background-position-x:-104px}}
.hills{animation-name:hills}@keyframes hills{from{background-position-x:0}to{background-position-x:-320px}}
button{font:600 14px -apple-system,sans-serif;padding:8px 14px;border-radius:99px;border:1px solid #ccc;background:#fff;cursor:pointer;margin-right:6px}</style></head>
<body><h1>Moz · variation 2</h1><p>Variation 1 plus the walking pose and walk cycle, a soft night rim light, lit feet and the wink. Nothing on the site has been replaced.</p>
<div class="meadow is-walking" id="meadow"><div class="hills"></div><div class="path"></div><div class="walker" id="walker"></div></div>
<p><button onclick="meadow.classList.toggle('is-walking')">Walk / stop</button><button onclick="document.querySelectorAll('.meadow *').forEach(e=>e.style.animationDuration=e.style.animationDuration?'':'')||document.body.classList.toggle('slow')">Slow motion</button></p>
<style>.slow .meadow *{animation-duration:2.6s!important}.slow .moz *{animation-duration:2.2s!important}</style>
<div class="row"><div class="c" style="width:300px" id="hero"></div><div class="c night" style="width:280px" id="nightStern"></div></div>
<div class="row" style="margin-top:16px" id="moods"></div>
<script>
walker.innerHTML = moz('walk',{id:'w'});
hero.innerHTML = moz('happy',{id:'h'}) + '<div>happy</div>';
nightStern.innerHTML = moz('stern',{id:'ns',rim:true}) + '<div>stern, night hero with rim light</div>';
moods.innerHTML = ['happy','stern','cheer','wave','wink','walk'].map((m,i)=>'<div class="c" style="width:170px">'+moz(m,{id:'m'+i})+'<div>'+m+'</div></div>').join('');
</script></body></html>
